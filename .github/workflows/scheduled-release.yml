name: Scheduled Release

# Publishes a release that was prepared in advance and deploys it to WordPress.org:
#   2026-11-25 -> 1.3.4
#   2026-12-02 -> 1.3.5
#   2026-12-09 -> 1.3.6
#   2026-12-16 -> 1.3.7
#   2026-12-23 -> 1.3.8
#   2026-12-30 -> 1.3.9
#   2027-01-06 -> 1.3.10
#   2027-01-13 -> 1.4.0
#   2027-01-20 -> 1.4.1
# The tag must already exist. A release created with GITHUB_TOKEN does not trigger
# other workflows, so the deploy workflow is called directly instead of relying on
# the "release published" event.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC (12:00 in Bangladesh) daily; the date map below decides whether a release is due.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release now (e.g. 1.4.1)
        required: true
        type: string

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_deploy: ${{ steps.release.outputs.should_deploy }}
    steps:
      - name: Create release if due
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            case "$(date -u +%F)" in
              2026-11-25) TAG="1.3.4" ;;
              2026-12-02) TAG="1.3.5" ;;
              2026-12-09) TAG="1.3.6" ;;
              2026-12-16) TAG="1.3.7" ;;
              2026-12-23) TAG="1.3.8" ;;
              2026-12-30) TAG="1.3.9" ;;
              2027-01-06) TAG="1.3.10" ;;
              2027-01-13) TAG="1.4.0" ;;
              2027-01-20) TAG="1.4.1" ;;
              *) TAG="" ;;
            esac
          fi
          case "$TAG" in
            1.4.1) NOTES="Performance and security audit: no more editor-dropdown queries on every frontend render, the stylesheet loads only on pages that use a widget, posts per page is capped at 100, and an opt-in uninstall cleanup." ;;
            1.4.0) NOTES="Post format badge for Post Card, Card Grid and Post Carousel, and an accent color setting." ;;
            1.3.10) NOTES="Filter tabs can filter by tag as well as category, and a new fallback image setting for the Post Carousel." ;;
            1.3.9) NOTES="New Post Carousel widget, category filter tabs with live search, and a Settings page to turn widgets on or off." ;;
            1.3.8) NOTES="Optional reading time (N min read) for Blog Grid, Post Card and Card Grid, with a words-per-minute setting." ;;
            1.3.7) NOTES="Optional Schema Markup (schema.org ItemList JSON-LD) for the post widgets. Off by default." ;;
            1.3.6) NOTES="Load more button and infinite scroll pagination for Blog Grid, Post Card, Card Grid and Smart Posts List, plus a fix for a wrong No posts found message." ;;
            1.3.5) NOTES="Packaging and readme fixes: own autoloader instead of the Composer vendor folder, readme Screenshots, Source code, Privacy, External services and Trademarks sections, GPL license file. No functional changes." ;;
            1.3.4) NOTES="Extra query options for the post widgets: post types, tags, authors, exclude posts and date range. Includes a direct-access guard fix." ;;
            *) NOTES="Release $TAG." ;;
          esac
          if [ -z "$TAG" ]; then
            echo "No release scheduled for today; skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" \
            --notes "$NOTES"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to WordPress.org
    needs: release
    if: needs.release.outputs.should_deploy == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-on-pushing-plugin.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
